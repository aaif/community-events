name: run-skill

# The ONE workflow allowed to hold real credentials. Everything about it is
# shaped by the fact that this repo is public:
#
# * Manual only (workflow_dispatch). Never `pull_request` / `pull_request_target`
#   / `issue_comment` — those let a stranger's branch or comment choose what
#   runs next to the secrets. `schedule` may be added later; it runs main only.
# * Secrets come from the `ops` GitHub Environment, which must be configured
#   with required reviewers and restricted to the `main` branch — so a run is
#   an explicit, logged, two-person action and a feature branch can't reach it.
# * Engines run in report mode unless `write` is ticked, and never with
#   `--i-have-approval` (Slack invites/kicks/archives and Drive share mail stay
#   a human, local action). nightly.py already downgrades `access` itself.
# * Output stays on the runner. No artifact upload, no job summary, no step
#   that cats a log: engine logs hold names and emails. CI=1 turns on --redact
#   in the engines, and the runner's own stdout (nightly.py) is PII-free.
# * Credentials are passed as environment variables only, never argv
#   (scripts/check_no_secret_args.py), and masked before use.
#
# scripts/check_workflows.py fails the build if any of this drifts.

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Which runner to invoke"
        required: true
        type: choice
        options: [nightly, audit-organizers, audit-members, audit-activity]
      write:
        description: "Apply changes (nightly only; access stays report-only). Leave off to report."
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: run-skill
  cancel-in-progress: false

jobs:
  run:
    # Belt and braces: the environment rule restricts to main; this guard
    # refuses anything else even if the environment is misconfigured.
    if: github.ref == 'refs/heads/main' && github.repository == 'aaif/community-events'
    runs-on: ubuntu-latest
    environment: ops
    timeout-minutes: 45
    env:
      CI: "1"                                   # engines default --redact on
      PYTHONPATH: lib
      AAIF_SLACK_READ_TOKEN: ${{ secrets.AAIF_SLACK_READ_TOKEN }}
      AAIF_SLACK_WRITE_TOKEN: ${{ secrets.AAIF_SLACK_WRITE_TOKEN }}
      GOOGLE_WORKSPACE_CLI_TOKEN: ${{ secrets.GOOGLE_WORKSPACE_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Mask credentials in the log
        run: |
          for v in AAIF_SLACK_READ_TOKEN AAIF_SLACK_WRITE_TOKEN GOOGLE_WORKSPACE_CLI_TOKEN; do
            [ -n "${!v}" ] && echo "::add-mask::${!v}"
          done
          echo "ok"
      - name: Install gws
        run: npm install -g @googleworkspace/cli
      - name: Run
        # Reports, caches and logs land in gitignored paths on this runner and
        # die with it. Nothing below uploads, summarises, or prints them.
        run: |
          set -euo pipefail
          case "${{ inputs.engine }}" in
            nightly)
              if [ "${{ inputs.write }}" = "true" ]; then
                python skills/aaif-sync-chapters/scripts/nightly.py --write
              else
                python skills/aaif-sync-chapters/scripts/nightly.py
              fi ;;
            audit-organizers) python skills/aaif-audit-slack/scripts/audit_organizers.py ;;
            audit-members)    python skills/aaif-audit-slack/scripts/audit_members.py ;;
            audit-activity)   python skills/aaif-audit-slack/scripts/audit_activity.py ;;
          esac
      - name: Scrub the runner
        if: always()
        run: rm -rf .slack-audit-cache nightly-reports backups/* slack-*-audit.* || true
