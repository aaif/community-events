name: validate

# Read-only validation. This workflow NEVER receives a Slack, Google, or Luma
# credential: it runs on every pull request — including ones from forks — so
# anything it could read, a stranger's PR could print. Skills that touch real
# data run only from run-skill.yml (workflow_dispatch, gated environment).
# scripts/check_workflows.py enforces that split (the parked file included).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        # runs `pre-commit run --all-files`: ruff, codespell, gitleaks, frontmatter,
        # banner, no-secret-args, and the workflow lint.

  plugin-validate:
    # Anthropic's own validator. The repo root is both the marketplace and the
    # single plugin (marketplace source "./"), so one call validates both the
    # marketplace.json and the plugin.json schema. SKILL.md frontmatter is
    # covered by the check-skill-frontmatter hook in the pre-commit job above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.239
      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

  pytest:
    # The stdlib-only helper library + skill scripts. The pre-commit job's ruff
    # hook is pyflakes-only and does NOT resolve imports, so this job is what
    # actually catches a broken import/rename (e.g. a stale `from aaif_meetups`).
    # Tests use synthetic fixtures only and make no network calls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - run: python -m pip install pytest pyyaml   # pyyaml: scripts/test_check_workflows.py
      - name: Library unit tests
        # PYTHONPATH=lib puts the aaif_events package on sys.path explicitly, so
        # `from aaif_events import ...` resolves deterministically (not just via
        # pytest's rootdir insertion).
        run: python -m pytest lib/aaif_events/tests -q
        env:
          PYTHONPATH: lib
      - name: Design tokens match the design system
        run: python scripts/extract_design_tokens.py --check
      - name: Skill script and repo-check tests
        run: |
          for t in skills/*/scripts/test_*.py scripts/test_*.py; do
            echo "== $t =="
            python "$t"
          done
