# Pre-commit hooks for the AAIF Community Events plugin marketplace.
#   Setup:  pipx install pre-commit && pre-commit install
#   Run:    pre-commit run --all-files
#   Update: pre-commit autoupdate
# CI runs the same hooks (see .github/workflows/validate.yml).

# Generated/cache artifacts pre-commit should never scan.
exclude: '^(.*/__pycache__/.*|.*\.pyc)$'

repos:
  # --- Standard hygiene -------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # design/aaif-design-system.html is a VENDORED self-extracting bundle:
      # its markup, fonts and images are base64/JSON blobs on very long lines.
      # Reformatting it is at best churn on a file we do not author and at
      # worst corruption of a payload, so the byte-level fixers skip it. It is
      # replaced wholesale, never edited. See DESIGN.md.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]   # keep intentional Markdown hard breaks
        exclude: '^design/aaif-design-system\.html$'
      - id: end-of-file-fixer
        exclude: '^design/aaif-design-system\.html$'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json                          # marketplace.json / plugin.json
      - id: check-yaml                          # *.yaml/*.yml only (not SKILL.md frontmatter)
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # --- Python: Ruff bug-focused lint (config in pyproject.toml) ---------------
  # Lint only (pyflakes + syntax), no reformatting. `--fix` still auto-removes
  # unused imports/vars but never restyles code; the helper scripts use a
  # deliberately compact style. A formatting sweep, if wanted, is its own PR.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]

  # --- Spelling (allowlist in pyproject.toml [tool.codespell]) ----------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  # --- Secret scanning (these scripts shell out + use urllib) -----------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- SKILL.md frontmatter syntax (broken YAML => empty metadata at runtime) --
  # Runs locally on commit and in CI; this hook — not `claude plugin validate`,
  # which only checks the manifest schemas — is what catches skill frontmatter.
  - repo: local
    hooks:
      - id: check-skill-frontmatter
        name: validate SKILL.md YAML frontmatter
        entry: python3 scripts/check_frontmatter.py
        language: python
        additional_dependencies: [pyyaml]
        files: 'SKILL\.md$'

  # --- Tooling-rule banner must not drift between its SKILL.md copies ---------
  # The banner is duplicated on purpose (skills ship downstream without
  # CLAUDE.md); this catches the copies silently diverging. Runs on the whole
  # set, not just changed files, since drift is a property of the set.
  - repo: local
    hooks:
      - id: check-tooling-banner
        name: tooling-rule banner is identical across SKILL.md
        entry: python3 scripts/check_tooling_banner.py
        language: python
        pass_filenames: false
        files: 'SKILL\.md$'

  # Its sibling: the copies agreeing is worth nothing if a skill that drives
  # gws carries no copy at all. Splitting one sync skill into four dropped the
  # banner from all four and every check stayed green.
  - repo: local
    hooks:
      - id: check-tooling-banner-coverage
        name: every gws-driving skill carries the tooling rule
        entry: python3 scripts/check_tooling_banner_coverage.py
        language: python
        pass_filenames: false
        files: '^skills/.*\.(py|md)$'

  # --- Secrets never travel on argv (env vars only; see AGENTS.md) ----------
  - repo: local
    hooks:
      - id: check-no-secret-args
        name: no token/key/secret accepted as a CLI flag
        entry: python3 scripts/check_no_secret_args.py
        language: python
        pass_filenames: false
        files: '\.py$'
  # --- One redaction surface, not nine -------------------------------------
  # `--redact` masks the names and addresses an ops report prints, and it only
  # works when the flag and the helpers that read it are the same module's. A
  # helper that reads a sibling module's flag is a helper `--redact` does not
  # govern; that is how an address once reached a public CI log. Both failure
  # modes are invisible in output, so this is enforced rather than reviewed.
  - repo: local
    hooks:
      - id: check-no-local-redaction
        name: redaction flag and helpers come from aaif_events.redact
        entry: python3 scripts/check_no_local_redaction.py
        language: python
        pass_filenames: false
        files: '\.py$'
  # --- Real people's identifiers never enter a public repo ------------------
  # A real organizer's address and two real Slack ids were committed here once,
  # under a rule in AGENTS.md that already forbade it. Rewriting history cleaned
  # the branch and left the old commit served at its SHA, which only GitHub can
  # finish removing. `files` is deliberately broad — the address went into a
  # docstring in lib/, not into a test.
  - repo: local
    hooks:
      - id: check-no-real-pii
        name: no real person's email or Slack id in tracked files
        entry: python3 scripts/check_no_real_pii.py
        language: python
        pass_filenames: false
        files: '\.(py|md|json|txt|ya?ml|html|css)$'
  # --- Giving up a skill's portability is a decision, not an accident --------
  # A skill whose scripts import lib/aaif_events only runs from a full checkout;
  # zipped for claude.ai it fails at import. AGENTS.md says taking that on is a
  # decision — this makes the decision visible, by requiring the README's list to
  # move in the same commit as the import.
  - repo: local
    hooks:
      - id: check-portable-skills
        name: lib-coupled skills match the README's standalone-zip caveat
        entry: python3 scripts/check_portable_skills.py
        language: python
        pass_filenames: false
        files: '(\.py|README\.md)$'
  # --- Generated design tokens must match the design system -------------------
  # design/aaif-tokens.css is derived from design/aaif-design-system.html. A
  # stale copy is worse than none: reports keep rendering, and keep looking
  # almost-right, long after the system moved. See DESIGN.md.
  - repo: local
    hooks:
      - id: check-design-tokens
        name: design tokens match the design system
        entry: python3 scripts/extract_design_tokens.py --check
        language: python
        pass_filenames: false
        files: '^(design/.*|scripts/extract_design_tokens\.py)$'

  # --- Workflows must not leak secrets/PII (public repo) ----------------------
  - repo: local
    hooks:
      - id: check-workflows
        name: workflows pass the public-repo secret/PII rules
        entry: python3 scripts/check_workflows.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: '^(\.github/workflows/.*\.ya?ml(\.disabled)?|scripts/check_workflows\.py)$'
