  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"UTF-8\"><title>AAIF One-Pager<\u002Ftitle><style>/*\n * AAIF Design System — Tokens\n * ---------------------------------------------------------------------\n * Agentic AI Foundation, a Linux Foundation project.\n *\n * Source of truth: aaif.io — rebuilt Aug 2026 on Next.js + Sanity CMS\n * (was WordPress/Salient). See site-audit-2026-08.md for the diff.\n * No codebase access: typography is a documented substitution and the\n * hero gradient is a CSS stand-in for a cross-origin .webp plate.\n */\n\n/* ───────── Webfonts ─────────\n * One family: Instrument Sans (OFL). The site self-hosts it through\n * next/font; we pull the identical family from Google Fonts so the\n * design system has no cross-origin dependency. No second display\n * face — display and UI are the same family at different sizes.\n * Mono is a system stack only; no webfont is shipped for it. */\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"6067a764-a59e-4a49-acf7-fe60e3b8c522\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"64d8adcb-a1b7-44ca-a0a2-2228518d1666\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"6067a764-a59e-4a49-acf7-fe60e3b8c52 : 'Instrument Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"64d8adcb-a1b7-44ca-a0a2-2228518d1666\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* The agent motif — bots built from the mark's primitives. */\n/*\n * AAIF Design System — The Agent\n * ---------------------------------------------------------------------\n * ONE mascot. Drawn once on a 48-unit icon grid, then placed in\n * situations: the agent works everywhere, so the character never\n * changes and only the surroundings do.\n *\n * Anatomy — all of it from the mark's primitives\n *   Shell   bracket square, radius 10/48, one spectrum hue\n *   Visor   near-black lozenge — the anchor. A saturated shell alone\n *           dies on warm off-white (amber especially); the visor keeps\n *           the silhouette and the gaze legible on black, white, and\n *           --paper-2 with no per-surface variant.\n *   Eyes    the mark's two dots, light, inside the visor. Two, always.\n *   Pods    side rounded rects in the hue — arms, never hands.\n *   Legs    2.5-unit strokes with round caps.\n *\n * Rules\n *   · One hue per agent. Never a gradient, never two hues.\n *   · Two eyes and nothing else: no mouth, no eyebrows, no\n *     accessories, no emoji, no second character.\n *   · Hue carries context, not personality — the agent is the same\n *     agent in every scene.\n *   · A motif, not a brand character with a name and a backstory:\n *     empty states, loading, event graphics, section dividers, 404.\n *     Never in governance, board, or press material.\n *   · Motion is constant-speed and small. All of it stops under\n *     prefers-reduced-motion.\n *\n * Two ways to place it\n *   <svg class=\"agent agent-teal\" viewBox=\"0 0 48 48\" width=\"72\">\n *     <use href=\"#agent\"><\u002Fuse><\u002Fsvg>          ← in scenes\n *   …inline the markup with .ag-* classes       ← when it must blink\n */\n\n.agent{display:block;overflow:visible;--hue:var(--spec-1);--visor:#0A0A0A;--glow:#FFFFFF;--stroke:#0A0A0A;color:var(--hue)}\n.agent-indigo{--hue:var(--spec-1)}\n.agent-blue{--hue:var(--spec-2)}\n.agent-teal{--hue:var(--spec-3)}\n.agent-amber{--hue:var(--spec-4)}\n.agent-magenta{--hue:var(--spec-5)}\n.agent-spring{--hue:var(--spec-6)}\n.agent-sky{--hue:var(--spec-7)}\n.agent-coral{--hue:var(--spec-8)}\n.agent-orchid{--hue:var(--spec-9)}\n.agent-chartreuse{--hue:var(--spec-10)}\n.agent-white{--hue:var(--ink-inv)}\n\n/* The agent markup is inlined at every placement: <use> shadow trees\n   do not inherit fill or custom properties reliably across renderers,\n   and inlining also lets each placement blink and bob. */\n/* On dark surfaces the strokes would vanish; the visor stays black. */\n.agent-inv{--stroke:rgba(255,255,255,.92)}\n\n/* Inline-markup parts (only needed when the agent must blink or walk) */\n.ag-shell,.ag-pod,.ag-tip{fill:var(--hue)}\n.ag-visor{fill:var(--visor)}\n.ag-eye{fill:var(--glow)}\n.ag-vent{fill:var(--visor);opacity:.26}\n.ag-stroke{stroke:var(--stroke);stroke-width:2.5;stroke-linecap:round;fill:none}\n.agent [class^=\"ag-\"]{transform-box:fill-box}\n\n@keyframes ag-blink{0%,92%,100%{transform:scaleY(1)}94%,98%{transform:scaleY(.12)}}\n@keyframes ag-bob{from{transform:translateY(0)}to{transform:translateY(-1px)}}\n@keyframes ag-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4%) rotate(2deg)}}\n@keyframes ag-signal{0%,100%{opacity:.3}50%{opacity:1}}\n@keyframes ag-scan{0%,100%{transform:translateX(0)}50%{transform:translateX(1.3px)}}\n@keyframes ag-walk{from{left:-14%}to{left:114%}}\n\n.ag-blink .ag-eye{transform-origin:50% 50%;animation:ag-blink 5.4s steps(1,end) infinite}\n.ag-blink .ag-eye:nth-of-type(2){animation-delay:.07s}\n.ag-bob .ag-body{animation:ag-bob .9s var(--ease-in-out) infinite alternate}\n.ag-scan .ag-eyes{animation:ag-scan 3.4s var(--ease-in-out) infinite}\n.ag-signal .ag-tip{animation:ag-signal 1.7s var(--ease-in-out) infinite}\n\n/* Whole-agent motion — works through <use>, so scenes can use it */\n.agent.is-float{animation:ag-float 5.2s var(--ease-in-out) infinite;transform-origin:50% 60%}\n.agent.is-bob{animation:ag-bob 1s var(--ease-in-out) infinite alternate}\n\n/* ───────── Situations ─────────\n * A scene is a 5:3 plate: geometry from the same primitives (arcs,\n * discs, triangles, strokes), one accent hue, and the agent placed in\n * it at 20–30% of the frame height. Scenes are backgrounds — they\n * carry a caption, never body copy. */\n.scene{position:relative;display:block;width:100%;border-radius:var(--radius-3);overflow:hidden}\n.scene-dark{background:var(--void)}\n.scene-warm{background:var(--paper-2)}\n.scene-cap{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-top:8px}\n.scene-dark+.scene-cap{color:var(--fg-3)}\n\n/* A band of agents crossing, for dividers and loading states */\n.agent-field{position:relative;overflow:hidden}\n.agent-field>.agent-roam{position:absolute}\n.agent-roam{animation:ag-walk var(--dur,18s) linear infinite;animation-delay:var(--delay,0s)}\n.agent-roam.is-back{animation-direction:reverse;transform:scaleX(-1)}\n\n@media (prefers-reduced-motion:reduce){.agent,.agent *,.agent-roam{animation:none!important}}\n\n\n/* Metric-matched fallback, mirroring the site's next/font overrides,\n   so layout doesn't shift before Instrument Sans loads. */\n@font-face {\n  font-family: 'Instrument Sans Fallback';\n  src: local('Arial');\n  ascent-override: 94.42%;\n  descent-override: 24.33%;\n  line-gap-override: 0%;\n  size-adjust: 102.74%;\n}\n\n:root {\n  /* ─────────────────────────────────────────────────────────\n   * COLORS\n   *\n   * The 2026 site is dark-entry: theme-color is #000000, the hero\n   * and closing CTA are black plates carrying a gradient image, and\n   * editorial content sits on white between them. Both surfaces are\n   * first-class — always state which one a component is drawn on.\n   * ──────────────────────────────────────────────────────── */\n\n  /* Neutrals — light surfaces */\n  --ink:        #0A0A0A;   /* primary text, logo, on-white surfaces */\n  --ink-2:      #1A1A1A;   /* secondary text */\n  --ink-3:      #4A4A4A;   /* tertiary text, captions */\n  --ink-4:      #8C8C8C;   /* placeholder, disabled label */\n  --line:       #E5E5E2;   /* hairline dividers */\n  --line-2:     #CFCFC9;   /* heavier dividers */\n  --paper:      #FFFFFF;   /* canonical content background */\n  --paper-2:    #F6F5F1;   /* warm off-white, used for sections */\n  --paper-3:    #ECEBE6;   /* tinted card / inset / chip */\n\n  /* Inverse (dark) surfaces — ribbon, hero, closing CTA, footer */\n  --void:       #000000;   /* page-entry black; matches theme-color */\n  --void-2:     #0A0A0A;   /* dark surface */\n  --void-3:     #161616;   /* raised dark card, filter row */\n  --ink-inv:    #FFFFFF;   /* text on dark */\n  --ink-inv-2:  #C9C9C5;   /* secondary text on dark */\n  --ink-inv-3:  #8A8A86;   /* meta text on dark */\n  --line-inv:   #262626;   /* hairline on dark */\n  --line-inv-2: rgba(255,255,255,0.14); /* hairline over imagery */\n\n  /* Spectrum — accents sampled from the gradient plate */\n  --spec-1:     #6C5CE7;   /* indigo */\n  --spec-2:     #4D7CFE;   /* electric blue */\n  --spec-3:     #14B8B0;   /* teal */\n  --spec-4:     #F2B23E;   /* amber highlight */\n  --spec-5:     #E94B7B;   /* magenta */\n\n  /* Spectrum, extended — five more hues that close the gaps in the wheel.\n     Rule is unchanged: one hue leads a surface. A second may appear only\n     as the object or action accent inside a chapter plate, never as a\n     second fill on the same element. spec-1…5 stay the primaries; 6…10\n     are the secondaries the agent carries. */\n  --spec-6:     #45C07A;   /* spring green — growth, seedlings, go */\n  --spec-7:     #38BDF8;   /* sky — water, air, cold-clear */\n  --spec-8:     #FF6B4A;   /* coral — heat, alert, energy */\n  --spec-9:     #A855F7;   /* orchid — night, signal, compute */\n  --spec-10:    #C9D93F;   /* chartreuse — leaves, late sun, sand light */\n\n  /* Scene neutrals — the sand masses in chapter plates. Three values so\n     terrain reads as depth (far, mid, near) instead of one flat opacity. */\n  --sand-far:   #E4E3DD;\n  --sand:       #CFCFC9;\n  --sand-near:  #B7B6AD;\n\n  /* Stand-in for the hero/CTA gradient plate (real asset is a .webp) */\n  --gradient-hero:\n      radial-gradient(120% 80% at 15% 20%, #6C5CE7 0%, transparent 55%),\n      radial-gradient(90% 70% at 85% 30%, #4D7CFE 0%, transparent 60%),\n      radial-gradient(100% 90% at 50% 100%, #14B8B0 0%, transparent 55%),\n      #000000; /* @kind color */\n  /* Bright fill for masked hero type — stands in for hero-text.webm.\n     Must stay legible on black, so it never drops below ~60% L. */\n  --gradient-fill: linear-gradient(96deg,#F2B23E 0%,#E94B7B 20%,#A78BFA 42%,#7FA8FF 66%,#4FD8CE 100%);\n  /* Softer plate: people cards, daily-briefing card */\n  --gradient-plate:\n      radial-gradient(90% 120% at 20% 0%, rgba(108,92,231,0.55) 0%, transparent 60%),\n      radial-gradient(80% 100% at 100% 100%, rgba(20,184,176,0.45) 0%, transparent 60%),\n      #0A0A0A; /* @kind color */\n\n  /* Semantic */\n  --success:    #2BB673;\n  --warning:    #E0A23A;\n  --danger:     #E26052;\n  --info:       #6B8FFF;\n\n  /* Aliases — by role, not by hex */\n  --fg-1:       var(--ink);\n  --fg-2:       var(--ink-2);\n  --fg-3:       var(--ink-3);\n  --fg-muted:   var(--ink-4);\n  --bg-1:       var(--paper);\n  --bg-2:       var(--paper-2);\n  --bg-3:       var(--paper-3);\n  --border-1:   var(--line);\n  --border-2:   var(--line-2);\n  --accent:     var(--ink);          /* primary actions are black */\n  --link:       var(--ink);\n  --link-hover: var(--spec-2);\n\n  /* ─────────────────────────────────────────────────────────\n   * TYPOGRAPHY — Instrument Sans, one family, weights 400/500/600/700\n   *\n   * --font-display is an alias of --font-sans, kept so existing\n   * components keep working. There is no second display face.\n   * Mono is a stack, not a webfont — use it only for metadata.\n   * ──────────────────────────────────────────────────────── */\n  --font-sans:    'Instrument Sans', 'Instrument Sans Fallback', ui-sans-serif, system-ui, sans-serif;\n  --font-display: var(--font-sans);\n  --font-mono:    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;\n\n  /* Type scale — the site's own tokens (size / line-height) */\n  --t-xs:   12px;   /* body xs  · 20 */\n  --t-sm:   14px;   /* body sm  · 20 */\n  --t-base: 16px;   /* body md  · 24 */\n  --t-md:   18px;   /* body lg  · 28 */\n  --t-lg:   20px;   /* h6       · 28 */\n  --t-xl:   24px;   /* h5       · 32 */\n  --t-2xl:  28px;   /* h4       · 36 */\n  --t-3xl:  32px;   /* h3       · 40 */\n  --t-4xl:  36px;   /* h2       · 44 */\n  --t-5xl:  40px;   /* h1       · 56 */\n  --t-6xl:  52px;   /* display  · 56 */\n  --t-display: 56px; /* @kind font */ /* display-2 · 56 */\n  /* Hero statement — the masked headline. Fluid above display-2,\n     capped there on small screens. Only once per page. */\n  --t-hero: clamp(40px, 6vw, 56px);      /* @kind font */\n\n  /* Line heights from the same tokens */\n  --lh-display: 56px;  /* @kind font */\n  --lh-h1: 56px;       /* @kind font */\n  --lh-h2: 44px;       /* @kind font */\n  --lh-h3: 40px;       /* @kind font */\n  --lh-h4: 36px;       /* @kind font */\n  --lh-h5: 32px;       /* @kind font */\n  --lh-h6: 28px;       /* @kind font */\n\n  --lh-tight: 1.05;  /* @kind font */\n  --lh-snug:  1.2;   /* @kind font */\n  --lh-base:  1.5;   /* @kind font */ /* body md 16/24 */\n  --lh-loose: 1.56;  /* @kind font */ /* body lg 18/28 */\n\n  --tr-tight: -0.02em;\n  --tr-snug:  -0.01em;\n  --tr-base:   0;      /* @kind font */\n  --tr-wide:   0.04em;\n  --tr-eyebrow: 0.16em;\n\n  /* ─────────────────────────────────────────────────────────\n   * SPACING / SIZING / RADII / MOTION\n   * ──────────────────────────────────────────────────────── */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* Icon sizes — MingCute UI icons, 24px grid */\n  --icon-xs: 14px;\n  --icon-sm: 16px;\n  --icon-md: 20px;\n  --icon-lg: 24px;\n  --icon-xl: 32px;\n\n  /* Chrome */\n  --nav-h:    72px;\n  --ribbon-h: 40px;\n\n  --radius-0: 0;\n  --radius-1: 2px;\n  --radius-2: 6px;\n  --radius-3: 10px;\n  --radius-4: 16px;\n  --radius-5: 24px;      /* image plates, hero cards, calendar shell */\n  --radius-pill: 999px;\n\n  /* AAIF is a flat system — no drop shadows. Depth comes from 1px\n     hairlines, surface tinting, and inset strokes over imagery. */\n  --shadow-1: 0 0 0 1px var(--line);\n  --shadow-2: 0 0 0 1px var(--line-2);\n  --shadow-3: 0 0 0 1px var(--ink);\n  --shadow-inset: inset 0 0 0 1px var(--line);\n  --shadow-inset-inv: inset 0 0 0 1px var(--line-inv-2);\n\n  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);   /* @kind other */\n  --ease-in-out: cubic-bezier(0.6, 0, 0.2, 1);  /* @kind other */\n  --dur-fast: 120ms;      /* @kind other */\n  --dur-base: 220ms;      /* @kind other */\n  --dur-slow: 420ms;      /* @kind other */\n  --dur-marquee: 40s;     /* @kind other */ /* photo + card marquees */\n\n  /* Layout */\n  --container: 1240px;\n  --container-wide: 1440px;   /* full-bleed plates cap here */\n  --container-narrow: 880px;\n  --grid-gutter: 32px;\n}\n\n/* ─────────────────────────────────────────────────────────\n * SEMANTIC ELEMENT STYLES\n * Apply to bare HTML. Anything more specific belongs in a component.\n * ──────────────────────────────────────────────────────── */\n\nhtml, body {\n  font-family: var(--font-sans);\n  font-size:   var(--t-base);\n  line-height: var(--lh-base);\n  color:       var(--fg-1);\n  background:  var(--bg-1);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6,\n.h1, .h2, .h3, .h4, .h5, .h6 {\n  font-family: var(--font-sans);\n  font-weight: 500;\n  color: var(--fg-1);\n  letter-spacing: var(--tr-tight);\n  line-height: var(--lh-tight);\n  margin: 0;\n  text-wrap: balance;\n}\n\nh1, .h1 { font-size: var(--t-5xl); line-height: var(--lh-h1); font-weight: 500; }\nh2, .h2 { font-size: var(--t-4xl); line-height: var(--lh-h2); font-weight: 500; }\nh3, .h3 { font-size: var(--t-3xl); line-height: var(--lh-h3); font-weight: 500; }\nh4, .h4 { font-size: var(--t-2xl); line-height: var(--lh-h4); font-weight: 500; letter-spacing: var(--tr-snug); }\nh5, .h5 { font-size: var(--t-xl);  line-height: var(--lh-h5); font-weight: 600; letter-spacing: var(--tr-snug); }\nh6, .h6 { font-size: var(--t-lg);  line-height: var(--lh-h6); font-weight: 600; letter-spacing: var(--tr-snug); }\n\n/* display 52/56 */\n.display {\n  font-family: var(--font-sans);\n  font-weight: 500;\n  font-size: var(--t-6xl);\n  line-height: var(--lh-display);\n  letter-spacing: -0.025em;\n  text-wrap: balance;\n}\n/* display-2 56/56 */\n.display-2 {\n  font-family: var(--font-sans);\n  font-weight: 500;\n  font-size: var(--t-display);\n  line-height: var(--lh-display);\n  letter-spacing: -0.025em;\n  text-wrap: balance;\n}\n\n/* The hero statement. One per page. Put .hero-fill on the clause that\n   carries the video mask (\"Help us build them\"). */\n.hero-statement {\n  font-family: var(--font-sans);\n  font-weight: 500;\n  font-size: var(--t-hero);\n  line-height: 0.94;\n  letter-spacing: -0.03em;\n  text-wrap: balance;\n  color: var(--ink-inv);\n}\n.hero-fill {\n  background: var(--gradient-fill);\n  background-size: cover;\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n}\n\n.eyebrow {\n  font-family: var(--font-mono);\n  font-size: var(--t-xs);\n  line-height: 20px;\n  font-weight: 500;\n  text-transform: uppercase;\n  letter-spacing: var(--tr-eyebrow);\n  color: var(--fg-3);\n}\n\np, .body { font-size: var(--t-base); line-height: 24px; color: var(--fg-2); }\n.body-lg { font-size: var(--t-md); line-height: 28px; color: var(--fg-2); }\n.body-sm { font-size: var(--t-sm); line-height: 20px; color: var(--fg-3); }\n.caption { font-size: var(--t-xs); line-height: 20px; color: var(--fg-3); }\n\na {\n  color: var(--link);\n  text-decoration: none;\n  border-bottom: 1px solid currentColor;\n  transition: color var(--dur-fast) var(--ease-out);\n}\na:hover { color: var(--link-hover); }\n\ncode, kbd, samp, .mono {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n}\ncode {\n  padding: 0.12em 0.4em;\n  background: var(--bg-3);\n  border-radius: var(--radius-2);\n}\n\nhr { border: 0; border-top: 1px solid var(--border-1); margin: var(--space-6) 0; }\n\n::selection { background: var(--ink); color: var(--ink-inv); }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }\n}\n<\u002Fstyle><style>doc-page:not(:defined){visibility:hidden}<\u002Fstyle><script src=\"a31b3596-a4f0-4743-9482-80eec8ac5960\"><\u002Fscript>\n\n<\u002Fhead><body style=\"margin:0\">\n<doc-page>\n<section class=\"page\" id=\"p1\" style=\"font-family:var(--font-sans);color:var(--ink);background:var(--paper);display:flex;flex-direction:column\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;padding:0.6in 0.75in 0\"><img src=\"01fd3e77-c704-49c4-b7e4-ed86830d7a20\" alt=\"AAIF\" style=\"width:1.6in\"><span style=\"font-family:var(--font-mono);font-size:9pt;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-3)\">Brief · 2026-08-27<\u002Fspan><\u002Fdiv>\n<div style=\"padding:0.
